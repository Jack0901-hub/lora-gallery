  <script>
    (function () {
      try {
        var lang = localStorage.getItem("ebook-vault-lang");
        var isEn = lang === "en";
        document.documentElement.lang = isEn ? "en" : "zh-CN";
        if (isEn) document.documentElement.setAttribute("data-i18n-pending", "1");
        var saved = localStorage.getItem("ebook-vault-theme");
        document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
      window.setTimeout(function () {
        document.documentElement.removeAttribute("data-i18n-pending");

    })();

<script>
/* 支持 ?q=关键词 深链：进入页面后自动执行该页自己的搜索 */
(function(){
  var q="";
  try{ q=(new URLSearchParams(location.search).get("q")||"").trim(); }catch(e){}
  if(!q) return;
  var tries=0;
  function run(){
    var el=document.getElementById("q");
    if(!el){ if(++tries<30) return setTimeout(run,120); return; }
    if(el.value!==q) el.value=q;
    el.dispatchEvent(new Event("input",{bubbles:true}));
    el.dispatchEvent(new Event("search",{bubbles:true}));
    if(++tries<6) setTimeout(run,220);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",run); else run();
})();
</script>
